syntax = "proto3";
package devchain.devchain.v1;

import "amino/amino.proto";
import "devchain/devchain/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "devchain/x/devchain/types";

// GenesisState defines the devchain module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
